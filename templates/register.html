{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký tài khoản</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css"/>

<style>
body{
margin:0;
font-family:Arial;
min-height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(135deg,#ff385c,#ff7a7a);
}

.main-wrapper{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* KHUNG */
.auth-container{
background:rgba(255,255,255,0.95);
padding:40px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.2);
width:100%;
max-width:420px;
backdrop-filter:blur(10px);
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1;}
}

/* TIÊU ĐỀ */
.auth-container h2{
text-align:center;
margin-bottom:20px;
font-weight:bold;
color:#333;
}

/* INPUT */
.form-control{
border-radius:10px;
padding:12px;
transition:0.3s;
border:1px solid #ddd;
}

.form-control:focus{
border-color:#ff385c;
box-shadow:0 0 10px rgba(255,56,92,0.4);
}

/* NÚT */
.btn-custom{
background:#ff385c;
color:white;
border:none;
font-weight:bold;
width:100%;
padding:12px;
border-radius:10px;
margin-top:15px;
transition:0.3s;
}

.btn-custom:hover{
background:black;
transform:scale(1.02);
}

/* LINK */
.link-text{
text-align:center;
margin-top:15px;
display:block;
text-decoration:none;
color:#555;
transition:0.3s;
}

.link-text:hover{
color:#ff385c;
}

/* LỖI */
ul.errorlist{
color:#ff385c;
list-style:none;
padding:0;
font-size:13px;
}

/* GỢI Ý */
.helptext{
font-size:12px;
color:#888;
}

/* ICON */
.logo{
text-align:center;
font-size:28px;
margin-bottom:10px;
}
</style>
</head>

<body>
<div class="main-wrapper">
<div class="auth-container" data-aos="zoom-in">

<div class="logo">🏠</div>

<h2>Đăng ký tài khoản</h2>

<form method="POST">
{% csrf_token %}

{{ form.as_p }}

<button type="submit" class="btn btn-custom">Tạo tài khoản</button>
</form>

<a href="/login/" class="link-text">Đã có tài khoản? Đăng nhập</a>
<a href="/" class="link-text">← Quay về trang chủ</a>

</div>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init();
</script>

{% include 'footer.html' %}
</body>
</html>
