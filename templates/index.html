<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WebGIS Homestay TP.HCM</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            background-color: #2c6aa0;
            color: white;
            padding: 12px 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .main {
            display: flex;
            height: calc(100vh - 50px);
        }

        #map {
            flex: 2;
        }

        .sidebar {
            flex: 1;
            padding: 15px;
            background: #f8f9fa;
            border-left: 1px solid #ddd;
            overflow-y: auto;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .result-item a {
            font-size: 14px;
        }

        .count-text {
            color: green;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="header">
    Bản đồ vùng Homestay TP.HCM
</div>

<div class="main">

    <div id="map"></div>

    <div class="sidebar">

        <h5>Danh sách Homestay</h5>

        <input type="text" id="search" class="form-control mb-2" placeholder="Tên homestay">

        <select id="district" class="form-select mb-2">
            <option value="">-- Chọn quận --</option>
            <option value="Quận 1">Quận 1</option>
            <option value="Quận 3">Quận 3</option>
            <option value="Thủ Đức">Thủ Đức</option>
        </select>

        <button onclick="loadHomestays()" class="btn btn-primary w-100 mb-2">
            Tìm kiếm
        </button>

        <button onclick="drawCircle()" class="btn btn-outline-secondary w-100 mb-2">
            Khoanh vùng homestay
        </button>

        <div id="result-count" class="count-text"></div>

        <div id="homestay-list"></div>

    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([10.7769, 106.7009], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var markers = [];
    var circle = null;

    function loadHomestays() {

        let search = document.getElementById("search").value;
        let district = document.getElementById("district").value;

        let url = `/api/homestays/?search=${search}&district=${district}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {

                markers.forEach(m => map.removeLayer(m));
                markers = [];

                document.getElementById("homestay-list").innerHTML = "";

                document.getElementById("result-count").innerText =
                    `Tìm thấy ${data.results.length} homestay`;

                data.results.forEach(item => {

                    let marker = L.marker([item.latitude, item.longitude])
                        .addTo(map)
                        .bindPopup(`<b>${item.name}</b><br>Quận: ${item.district}`);

                    markers.push(marker);

                    let html = `
                        <div class="result-item">
                            <b>${item.name}</b><br>
                            Quận: ${item.district}<br>
                            <a href="#">Xem chi tiết</a>
                        </div>
                    `;

                    document.getElementById("homestay-list").innerHTML += html;
                });

            });
    }

    function drawCircle() {
        if (circle) {
            map.removeLayer(circle);
        }

        circle = L.circle([10.7769, 106.7009], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.3,
            radius: 2000
        }).addTo(map);
    }

    loadHomestays();
</script>

</body>
</html>
