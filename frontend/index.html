<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>WebGIS Homestay TP.HCM</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>

<style>
body { margin: 0; font-family: Arial; }
header {
    background: #2c3e50;
    color: white;
    padding: 15px;
    font-size: 22px;
}
#container {
    display: flex;
    height: calc(100vh - 60px);
}
#map { width: 70%; height: 100%; }
#sidebar {
    width: 30%;
    padding: 15px;
    border-left: 1px solid #ccc;
    overflow-y: auto;
}
input, select, button {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
}
.result {
    font-weight: bold;
    color: green;
}
a {
    color: #0066cc;
    text-decoration: none;
}
a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<header>
WebGIS tìm kiếm & khoanh vùng Homestay TP.HCM
</header>

<div id="container">

<div id="map"></div>

<div id="sidebar">
<h3>Danh sách Homestay</h3>

<input id="keyword" placeholder="Tên homestay">
<select id="district">
    <option value="">-- Chọn quận --</option>
    <option>Quận 1</option>
    <option>Quận 3</option>
    <option>Thủ Đức</option>
</select>

<button onclick="search()">Tìm kiếm</button>
<button onclick="enableDraw()">Khoanh vùng homestay</button>

<p id="result" class="result"></p>
<hr>
<div id="list"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script>
var map = L.map('map').setView([10.7769, 106.7009], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
}).addTo(map);

/* ===== DỮ LIỆU (CÓ ID – PHỤC VỤ BƯỚC 14.4) ===== */
var homestays = [
 {id:1, name:"Homestay Quận 1", district:"Quận 1", lat:10.776889, lng:106.700806},
 {id:2, name:"Homestay Quận 3", district:"Quận 3", lat:10.780087, lng:106.682225},
 {id:3, name:"Homestay Thủ Đức", district:"Thủ Đức", lat:10.849320, lng:106.753770}
];

var markers=[];
var drawnItems = new L.FeatureGroup().addTo(map);

var drawControl = new L.Control.Draw({
    draw:{
        polygon:true,
        rectangle:false,
        circle:false,
        polyline:false,
        marker:false
    },
    edit:{ featureGroup: drawnItems }
});

/* ===== HIỂN THỊ (ĐÃ THÊM 14.4) ===== */
function render(data){
    document.getElementById("list").innerHTML="";
    document.getElementById("result").innerText =
        `Tìm thấy ${data.length} homestay`;

    markers.forEach(m=>map.removeLayer(m));
    markers=[];

    data.forEach(h=>{
        var m = L.marker([h.lat,h.lng]).addTo(map)
            .bindPopup(`
                <b>${h.name}</b><br>
                Quận: ${h.district}<br>
                <a href="/homestay/detail/${h.id}/" target="_blank">
                    Xem chi tiết
                </a>
            `);
        markers.push(m);

        document.getElementById("list").innerHTML += `
            <b>${h.name}</b><br>
            Quận: ${h.district}<br>
            <a href="/homestay/detail/${h.id}/" target="_blank">
                Xem chi tiết
            </a>
            <hr>
        `;
    });
}

/* ===== TÌM KIẾM ===== */
function search(){
    var k=document.getElementById("keyword").value.toLowerCase();
    var d=document.getElementById("district").value;

    var f=homestays.filter(h=>
        h.name.toLowerCase().includes(k) &&
        (d==""||h.district==d)
    );
    render(f);
}

/* ===== KHOANH VÙNG CHUẨN GIS ===== */
function enableDraw(){
    map.addControl(drawControl);
}

map.on(L.Draw.Event.CREATED,function(e){
    drawnItems.clearLayers();
    drawnItems.addLayer(e.layer);

    var polygon=e.layer;
    var inside=[];

    homestays.forEach(h=>{
        var point = L.latLng(h.lat, h.lng);
        if (polygon.contains(point)) {
            inside.push(h);
        }
    });

    render(inside);
});

/* ===== LOAD BAN ĐẦU ===== */
render(homestays);
</script>

</body>
</html>
