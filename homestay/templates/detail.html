<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>{{ h.name }}</title>
<style>
body { font-family: Arial; padding: 30px; }
.card {
    max-width: 500px;
    margin: auto;
    border: 1px solid #ccc;
    padding: 20px;
}
</style>
</head>
<body>

<div class="card">
<h2>{{ h.name }}</h2>
<p><b>Quận:</b> {{ h.district }}</p>
<p><b>Giá:</b> {{ h.price }} VND / đêm</p>
<p><b>Mô tả:</b> {{ h.desc }}</p>

<a href="/">⬅ Quay lại bản đồ</a>
</div>

</body>
</html>
